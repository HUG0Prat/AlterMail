<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
  <title>AlterMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app">

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="tl-left">
      <div class="logo-wrap">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="3" width="16" height="12" rx="2.5" stroke="var(--accent)" stroke-width="1.4"/>
          <path d="M1.5 6l7.5 5 7.5-5" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="14" cy="13" r="3" fill="var(--bg0)" stroke="var(--a2)" stroke-width="1.2"/>
          <path d="M13 13h2M14 12v2" stroke="var(--a2)" stroke-width="1" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="app-name">AlterMail</span>
      <!-- Profile switcher -->
      <div class="psw" id="psw">
        <button class="psw-btn" id="psw-btn">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><circle cx="5.5" cy="3.5" r="2.2" stroke="currentColor" stroke-width="1.1"/><path d="M1 9.5c0-2 2-3.5 4.5-3.5S10 7.5 10 9.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <span id="psw-name">Profil principal</span>
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M2 3l2.5 2.5L7 3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
        </button>
        <div class="psw-dd hidden" id="psw-dd"></div>
      </div>
    </div>
    <div class="tl-ctrls">
      <button class="tc" id="tc-min"><svg width="10" height="1"><rect width="10" height="1" fill="currentColor" rx=".5"/></svg></button>
      <button class="tc" id="tc-max"><svg width="9" height="9"><rect x=".5" y=".5" width="8" height="8" rx="1.5" stroke="currentColor" fill="none"/></svg></button>
      <button class="tc tc-x" id="tc-cls"><svg width="9" height="9"><path d="M1 1l7 7M8 1l-7 7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <!-- Layout -->
  <div class="layout">
    <nav class="sidebar">
      <div class="nav-grp">
        <button class="ni active" data-page="compose">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Composer
        </button>
        <button class="ni" data-page="documents">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="1" width="8" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 4.5h5M4.5 7h3" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="11" cy="11" r="2.5" fill="var(--bg0)" stroke="var(--a2)" stroke-width="1.1"/><path d="M10 11h2M11 10v2" stroke="var(--a2)" stroke-width=".9" stroke-linecap="round"/></svg>
          Documents
        </button>
        <button class="ni" data-page="templates">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 13h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M7 10v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M4 4.5h6M4 6.5h4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          Modèles
        </button>
        <button class="ni" data-page="thread">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M13 1L6 8M13 1l-3.5 10.5L7 8.5 3.5 6.5 13 1z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Conversations
          <span class="bdg hidden" id="bdg-thread">0</span>
        </button>
        <button class="ni" data-page="tracker">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1 5h12M5 5v8" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          Suivi candidatures
          <span class="bdg hidden" id="bdg-tracker">0</span>
        </button>
      </div>
      <div class="nav-grp nav-bot">
        <button class="ni" id="ni-data">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 5h10M3 3h3l1 1.5H12a.8.8 0 01.8.8v5.4a.8.8 0 01-.8.8H2a.8.8 0 01-.8-.8V3.8A.8.8 0 012 3h1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Mes données
        </button>
        <button class="ni" data-page="settings">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.2" stroke="currentColor" stroke-width="1.2"/><path d="M7 1v1.3M7 11.7V13M13 7h-1.3M2.3 7H1M11.2 2.8l-.9.9M3.7 10.3l-.9.9M11.2 11.2l-.9-.9M3.7 3.7l-.9-.9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Paramètres
        </button>
      </div>
    </nav>

    <main class="content" id="content"></main>
  </div>
</div>

<!-- Send confirm modal -->
<div class="moverlay hidden" id="send-modal">
  <div class="modal modal-lg">
    <div class="mhd"><h3>Aperçu et envoi</h3><button class="mx" id="send-modal-x"><svg width="11" height="11"><path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
    <div class="mbody" id="send-modal-body"></div>
    <div class="mfoot" id="send-modal-foot"></div>
  </div>
</div>

<!-- Generic modal -->
<div class="moverlay hidden" id="gmodal">
  <div class="modal" id="gmodal-inner">
    <div class="mhd"><h3 id="gmodal-title"></h3><button class="mx" id="gmodal-x"><svg width="11" height="11"><path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
    <div class="mbody" id="gmodal-body"></div>
    <div class="mfoot hidden" id="gmodal-foot"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
